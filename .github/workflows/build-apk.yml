name: Construire APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Décompresser le projet
        run: |
          mkdir project
          unzip -q *.zip -d project

      - name: Construire APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Compiler
        run: |
          cd "$(dirname "$(find project -name settings.gradle -print -quit)")"
          gradle assembleDebug

      - name: Récupérer app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
