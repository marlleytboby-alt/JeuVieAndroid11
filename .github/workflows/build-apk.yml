name: Construire APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Décompresser le projet
        run: |
          rm -rf project
          mkdir project
          unzip -q "JeuVieOriginal_V7_Histoires_Personnages.zip" -d project

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Compiler l'APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle -print -quit)")
          echo "Projet trouvé dans : $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Vérifier l'APK
        run: |
          find project -type f -name "app-debug.apk" -print

      - name: Récupérer app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: Ma-Nouvelle-Vie-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: errorname: Coname: Construire APK

